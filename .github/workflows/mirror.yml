name: Mirror to git.couturier.prof
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add mirror https://git.couturier.prof/mmagron/csf-mamba.git
          auth_header="AUTHORIZATION: basic $(printf 'mmagron:%s' "$GITEA_TOKEN" | base64 -w0)"
          git -c "http.https://git.couturier.prof/.extraheader=$auth_header" push mirror --all
          git -c "http.https://git.couturier.prof/.extraheader=$auth_header" push mirror --tags
